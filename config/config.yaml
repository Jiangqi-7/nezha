# neZha 统一配置文件
# 包含模型、日志、角色配置

# 应用配置
app:
  name: nezha
  cli: nezha-cli
  mcp: nezha-mcp

# 模型配置
model:
  provider: dashscope-aliyun  # openai / anthropic / google / dashscope-aliyun / volcengine / minimax / zhipu / moonshot / deepseek / local / openrouter
  model: qwen3-8b
  api_key: ${DASHSCOPE_API_KEY}
  base_url: ${DASHSCOPE_BASE_URL}

# 日志配置
logging:
  level: INFO  # DEBUG / INFO / WARNING / ERROR

# 角色配置
roles:
  lawyer:
    name: 律师
    description: 合同风险、法律建议
    prompt_file: prompts/role_playing/lawyer.md

  tech:
    name: 技术顾问
    description: 代码、架构、技术选型
    prompt_file: prompts/role_playing/tech.md

  marketing:
    name: 营销顾问
    description: 推广策略、用户增长
    prompt_file: prompts/role_playing/marketing.md

  screenwriter:
    name: 剧本大师
    description: 故事创作、剧本编写、角色对话
    prompt_file: prompts/role_playing/screenwriter.md

  resume_coach:
    name: 简历教练
    description: 简历优化、求职辅导、面试准备
    prompt_file: prompts/role_playing/resume_coach.md

  picky_boss:
    name: 挑剔老板
    description: 文档审核、演讲稿改进、批评指导
    prompt_file: prompts/role_playing/picky_boss.md

  json_prompt_generator:
    name: 双旗镇刀客风格图像生成
    description: 老电影风格图像提示词生成
    prompt_file: prompts/role_playing/json_prompt_generator.md

  nanobanana2:
    name: Nano Banana 2 电影级拼图大导
    description: 6x6电影截图紧凑拼图提示词生成
    prompt_file: prompts/role_playing/nanobanana2.md

  image_prompt_generator:
    name: 图像提示词生成器
    description: 中英文双语图像提示词生成
    prompt_file: prompts/role_playing/image_prompt_generator.md

  ai_comic_creator:
    name: AI漫剧创作大师
    description: 从剧本到分镜图到视频的全流程创作
    prompt_file: prompts/role_playing/ai_comic_creator.md

# 代码助手配置
code_assistant:
  model:
    provider: dashscope-aliyun
    model: qwen3-8b
    enable_thinking: false
  document:
    source: url    # url / local / both / none
    urls:
      - "https://docs.python.org/3/"
    local_paths:   # 本地文档路径（支持 glob 模式）
      - "README.md"
    cache: true
  executor:
    type: python_sandbox
    timeout: 5
    memory_limit: "128m"
  max_iterations: 2
  enable_reflect: false
  prompt_file: code_assistant/generate.md
  # subprocess 调用超时配置（秒）
  subprocess_timeout: 120
  document_load_timeout: 45
  recursion_limit: 100

# 歌词创作工作流配置
lyricist:
  max_iterations: 5
  pass_threshold: 75
  plagiarism_threshold: 0.3
  evaluation:
    weights:
      narrative: 0.25
      imagery: 0.25
      rhyme: 0.20
      emotion: 0.20
      singable: 0.10
  cases:
    good_dir: workflows/creation/lyricist/cases/good
    bad_dir: workflows/creation/lyricist/cases/bad